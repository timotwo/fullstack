<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEBOTWO</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header class="topo">

        <div class="logo">

            <h1>SEBOTWO</h1>
        </div>

        <div class="busca">
            <input
                type="text"
                id="campo-busca"
                placeholder="Buscar"
            >

            <button id="botao-busca">
                Buscar
            </button>
        </div>

        <div class="acoes">
            <button
                class="btn-secundario"
                id="botao-login"
            >
                Entrar
            </button>
            <button class="btn-principal" onclick="irParaAnunciar()">
                    Anunciar livro
            </button>
            <button class="btn-secundario" id="botao-meusanuncios" hidden>
                Meus anúncios
            </button>
        </div>

    </header>


    <main>

        <section class="hero">

            <div>

                
                <video
                    class="hero-video"
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="auto"
                    aria-hidden="true"
                >
                    
                    <source src="img/uou.mp4" type="video/mp4">
                    
                </video>

                
                <p>Compre e venda livros de segunda mão de gente como você</p>

                <button class="btn-principal" onclick="document.getElementById('livros').scrollIntoView({ behavior: 'smooth' })">
                    Explorar livros
                </button>
                <button class="btn-principal" onclick="irParaAnunciar()">
                    Anunciar livro
                </button>
            </div>

        </section>




        <section class="livros-section" id="livros">

            <div class="section-header">
                <div>
                    <h2>Livros disponíveis</h2>

                </div>
            </div>

            <div id="lista-livros" class="lista-livros">

                <p>Carregando livros...</p>

            </div>

        </section>

    </main>


    <footer>

        <p> SEBOTWO</p>

    </footer>

    <script src="script.js"></script>
</body>
</html>
