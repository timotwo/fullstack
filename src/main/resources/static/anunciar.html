<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anunciar livro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">

        <div class="logo">
         
            <h1>SEBOTWO</h1>
        </div>

        <div class="acoes">
            <button class="btn-secundario" onclick="window.location.href='/'">
                Voltar
            </button>
        </div>

    </header>

    <main>

        <section class="formulario-section">

            <div class="formulario">

                <h2>Anunciar livro</h2>

                

                <form id="form-anuncio">

                    <label for="titulo">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        
                    >

                    <label for="autor">Autor</label>
                    <input
                        type="text"
                        id="autor"
                        
                    >

                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        
                    ></textarea>

                    <label for="preco">Preço</label>
                    <input
                        type="number"
                        id="preco"
                        step="0.01"
                        min="0"
                        required
                    >

                    <label for="estadoConservacao">Estado de conservação</label>
                    <select id="estadoConservacao" required>
                        
                        <option value="Novo">Novo</option>
                        <option value="Excelente">Excelente</option>
                        <option value="Bom">Bom</option>
                        <option value="Regular">Regular</option>
                        <option value="Ruim">Ruim</option>
                    </select>

                    <label for="imagem">Foto do livro</label>
                    <input
                        type="file"
                        id="imagem"
                        accept="image/jpeg,image/png,image/webp"
                    >
                    <img id="previa" alt="Prévia da foto do livro">

                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Carregando categorias..</option>
                    </select>

                    <button type="submit" class="btn-principal">
                        Publicar livro
                    </button>

                </form>

                <p id="mensagem"></p>

            </div>

        </section>

    </main>

    <script src="anunciar.js"></script>

</body>

</html>
